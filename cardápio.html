<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

      #contato {
      text-align: center;
    }
    
    #localização {
      text-align: center;
    }
  </style>
</head>
<body>

   <!-- LOCALIZAÇÃO-->
  <section id="localização">
    <h2>Onde Estamos</h2>

    <iframe
        src="https://maps.google.com/maps?q=Campinas%20SP&t=&z=13&ie=UTF8&iwloc=&output=embed"
        width="600"
        height="450"
        style="border:0;"
        allowfullscreen=""
        loading="lazy">
    </iframe>
</section>

<!-- CONTATO -->
<section id="contato">
  <h2>Contato</h2>

  <form>
    Nome: <input type="text"><br><br>
    Email: <input type="email"><br><br>
    Idade: <input type="number"><br><br>
    Senha: <input type="password"><br><br>
    Data: <input type="date"><br><br>

    <input type="submit" value="Enviar">
  </form>
</section>


</body>
</html>
